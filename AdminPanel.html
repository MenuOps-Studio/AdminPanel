    // Ηχητική Ειδοποίηση μέσω Web Audio API (Χωρίς εξωτερικά αρχεία)
    function playNotificationSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      function playBeep(freq, time) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(1, ctx.currentTime + time);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + time + 0.3);
        osc.start(ctx.currentTime + time);
        osc.stop(ctx.currentTime + time + 0.3);
      }
      playBeep(880, 0);   
      playBeep(1100, 0.2); 
    }

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      
      if (session) {
        currentUser = session.user;
        renderDashboardPlaceholder();
        fetchRestaurantData();
      } else {
        renderLogin();
      }

      db.auth.onAuthStateChange((_event, session) => {
        if (session) {
          currentUser = session.user;
          renderDashboardPlaceholder();
          fetchRestaurantData();
        } else {
          currentUser = null;
          renderLogin();
        }
      });

      // Real-time Updates για Μενού, Υλικά και Παραγγελίες
      db.channel('system-updates')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'menu_items' }, (payload) => {
            productsData = productsData.map(p => p.id === payload.new.id ? payload.new : p);
            if (activeTab === 'products') renderProducts();
        })
        // ΝΕΟ: Ζωντανή ενημέρωση ΚΑΙ για τα υλικά
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'ingredients' }, (payload) => {
            ingredientsData = ingredientsData.map(i => i.id === payload.new.id ? payload.new : i);
            if (activeTab === 'ingredients') renderIngredientsTab();
            if (activeTab === 'products') renderProducts(); // Ανανεώνει και τα πιάτα, γιατί δείχνουν τα εξαντλημένα υλικά!
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, (payload) => {
            const newOrder = payload.new;
            if(restaurantData && newOrder.restaurant_id === restaurantData.id) {
                ordersData.unshift(newOrder); 
                playNotificationSound();
                printOrderReceipt(newOrder);
                if (activeTab === 'orders') renderOrdersTab();
            }
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, (payload) => {
            if(restaurantData && payload.new.restaurant_id === restaurantData.id) {
                ordersData = ordersData.map(o => o.id === payload.new.id ? payload.new : o);
                if (activeTab === 'orders') renderOrdersTab();
            }
        })
        .subscribe();
    }

    async function fetchRestaurantData() {
      const { data: restData, error: restError } = await db.from("restaurants").select("*").eq("owner_id", currentUser.id).single();

      if (restError || !restData) {
        document.getElementById('dashboardContent').innerHTML = `<div class="py-20 text-center font-bold">Δεν βρέθηκε κατάστημα.</div>`;
        return;
      }

      restaurantData = restData;
      document.getElementById('navBrand').innerHTML = `<span class="text-xl font-bold text-stone-100 tracking-wider font-serif italic">${restaurantData.name} <span class="text-[#C09A5B] not-italic text-sm ml-1 font-sans">ADMIN</span></span>`;

      // Fetch Menu
      const { data: menuData } = await db.from("menu_items").select("*").eq("restaurant_id", restData.id).order("sort_order", { ascending: true }).order("id", { ascending: true });
      productsData = menuData || [];

      // Fetch Ingredients
      const { data: ingData } = await db.from("ingredients").select("*").eq("restaurant_id", restData.id).order("name", { ascending: true });
      ingredientsData = ingData || [];

      // Fetch Reservations
      const { data: rData } = await db.from("reservations").select("*").eq("restaurant_id", restData.id).order('date', { ascending: false });
      reservationsData = rData || [];
      
      // Fetch Orders
      const retentionHours = restData.orders_retention_hours || 12;
      const now = new Date();
      const { data: ordData } = await db.from("orders").select("*").eq("restaurant_id", restData.id).order('created_at', { ascending: false });
      
      if (ordData) {
        ordersData = ordData.filter(o => {
          const orderDate = new Date(o.created_at);
          const diffHours = (now - orderDate) / (1000 * 60 * 60);
          return diffHours <= retentionHours;
        });
      }

      document.getElementById('topControls').classList.remove('hidden');
      document.getElementById('tabsContainer').classList.remove('hidden');
      
      // ΝΕΑ ΛΟΓΙΚΗ ΓΙΑ ΔΙΑΚΟΠΤΕΣ: Αν δεν έχει κρατήσεις, κρύψε το tab
      const resTab = document.getElementById('tab-reservations');
      if (restaurantData.has_reservations === false) {
        if (resTab) resTab.style.display = 'none';
        if (activeTab === 'reservations') activeTab = 'orders';
      } else {
        if (resTab) resTab.style.display = 'block';
      }

      switchTab(activeTab);
    }
    window.switchTab = function(tab) {
      activeTab = tab;
      const tabs = ['orders', 'products', 'ingredients', 'reservations'];
      
      document.getElementById('searchInput').value = "";
      searchTerm = "";

      tabs.forEach(t => {
        const el = document.getElementById('tab-' + t);
        if (t === tab) {
            el.className = "px-6 py-2.5 font-bold text-sm border-b-2 border-stone-900 text-stone-900 transition-all";
        } else {
            el.className = "px-6 py-2.5 font-semibold text-sm border-b-2 border-transparent text-stone-600 hover:text-stone-900 transition-all";
        }
      });

      if (tab === 'orders') renderOrdersTab();
      else if (tab === 'products') renderProducts();
      else if (tab === 'ingredients') renderIngredientsTab();
      else renderReservationsTab();
    }

    // === TAB: KANBAN ΠΑΡΑΓΓΕΛΙΩΝ ===
    function renderOrdersTab() {
      const content = document.getElementById('dashboardContent');
      const statsContainer = document.getElementById('statsContainer');

      const activeOrdersCount = ordersData.filter(o => o.prep_status !== 'COMPLETED' && o.prep_status !== 'CANCELLED').length;
      if (statsContainer) {
        statsContainer.innerHTML = `
          <span class="text-2xl">🔥</span>
          <div>
            <p class="text-xs text-stone-500 uppercase font-bold tracking-wider">Ενεργες</p>
            <p class="text-xl font-bold text-stone-800">${activeOrdersCount} Παραγγελίες</p>
          </div>
        `;
      }

      const colWaiting = ordersData.filter(o => o.prep_status === 'WAITING');
      const colPreparing = ordersData.filter(o => o.prep_status === 'PREPARING');
      const colReady = ordersData.filter(o => o.prep_status === 'READY');
      const colCompleted = ordersData.filter(o => o.prep_status === 'COMPLETED');

      function buildCard(order) {
        const isPaid = order.payment_status === 'PAID';
        let itemsArray = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
        
        let itemsList = itemsArray.map(i => `
          <div class="text-sm border-b border-stone-200 pb-2 mb-2 last:border-0">
            <span class="font-bold text-stone-900">${i.quantity}x ${i.name}</span>
            ${i.removedIngredients && i.removedIngredients.length > 0 ? `<br><span class="text-xs text-red-500 font-semibold">- Χωρίς: ${i.removedIngredients.join(', ')}</span>` : ''}
            ${i.itemNote ? `<br><span class="text-xs text-stone-500 italic">"${i.itemNote}"</span>` : ''}
          </div>
        `).join('');

        let actionButton = '';
        if (order.prep_status === 'WAITING') {
            actionButton = `<button onclick="updateOrder(${order.id}, 'PREPARING')" class="w-full bg-amber-500 text-white font-bold py-2 rounded-lg mt-3 hover:bg-amber-600 transition-colors">→ Στην Κουζίνα</button>`;
        } else if (order.prep_status === 'PREPARING') {
            actionButton = `<button onclick="updateOrder(${order.id}, 'READY')" class="w-full bg-blue-500 text-white font-bold py-2 rounded-lg mt-3 hover:bg-blue-600 transition-colors">→ Έτοιμη!</button>`;
        } else if (order.prep_status === 'READY') {
            // ΕΔΩ Η ΜΕΓΑΛΗ ΑΛΛΑΓΗ ΓΙΑ ΤΙΣ ΕΤΟΙΜΕΣ ΠΑΡΑΓΓΕΛΙΕΣ
            if (!isPaid) {
                actionButton = `<button onclick="completeAndPayOrder(${order.id}, false)" class="w-full bg-red-50 text-red-600 border border-red-200 font-bold py-2.5 rounded-lg mt-3 hover:bg-red-100 transition-colors shadow-sm">💳 ΑΠΛΗΡΩΤΗ (Ταμείο) &rarr;</button>`;
            } else {
                actionButton = `<button onclick="completeAndPayOrder(${order.id}, true)" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg mt-3 hover:bg-emerald-700 transition-colors shadow-sm">✔ Παράδοση (Εξοφλήθηκε)</button>`;
            }
        }

        const timeStr = new Date(order.created_at).toLocaleTimeString('el-GR', {hour: '2-digit', minute:'2-digit'});

        return `
          <div class="bg-white border border-stone-200 rounded-xl p-4 shadow-sm relative mb-4 transition-all">
            <div class="flex justify-between items-start mb-3 border-b border-stone-100 pb-3">
              <div>
                <span class="text-[12px] text-stone-500 font-bold uppercase tracking-widest">#${order.daily_order_number || '-'} · ${timeStr}</span>
                <h3 class="text-2xl font-bold font-serif text-[#C09A5B] leading-none mt-1">Τρ. ${order.table_number || '-'}</h3>
              </div>
              
              <div class="px-2 py-1.5 rounded-md text-[10px] font-bold border ${isPaid ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-red-50 text-red-700 border-red-200'}">
                ${isPaid ? 'ΠΛΗΡΩΘΗΚΕ' : 'ΑΠΛΗΡΩΤΗ'}
              </div>
            </div>
            
            <div class="mb-3 max-h-48 overflow-y-auto pr-2">${itemsList}</div>
            
            <div class="flex justify-between items-center bg-stone-50 p-2 rounded-lg border border-stone-100">
              <span class="text-xs font-bold text-stone-500">Σύνολο:</span>
              <span class="font-bold text-lg text-stone-900">€${order.total_amount}</span>
            </div>
            
            ${actionButton}
            
            <div class="mt-3 text-center flex justify-between px-2">
               <button onclick='printOrderReceipt(${JSON.stringify(order).replace(/'/g, "&#39;")})' class="text-xs text-stone-400 hover:text-stone-700 font-medium">🖨️ Επανεκτύπωση</button>
               <button onclick="updateOrder(${order.id}, 'CANCELLED')" class="text-xs text-red-400 hover:text-red-700 font-medium">❌ Ακύρωση</button>
            </div>
          </div>
        `;
      }

      content.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-start">
          <div class="bg-stone-100/60 rounded-2xl p-4 border border-stone-200 shadow-inner min-h-[50vh]">
            <h2 class="font-bold text-stone-800 mb-4 flex items-center justify-between">
              Νέες (${colWaiting.length}) ${colWaiting.length > 0 ? '<span class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></span>' : ''}
            </h2>
            <div>${colWaiting.map(buildCard).join('')}</div>
          </div>
          <div class="bg-stone-100/60 rounded-2xl p-4 border border-stone-200 shadow-inner min-h-[50vh]">
            <h2 class="font-bold text-stone-800 mb-4">Ετοιμάζονται (${colPreparing.length})</h2>
            <div>${colPreparing.map(buildCard).join('')}</div>
          </div>
          <div class="bg-stone-100/60 rounded-2xl p-4 border border-stone-200 shadow-inner min-h-[50vh]">
            <h2 class="font-bold text-stone-800 mb-4">Έτοιμες (${colReady.length})</h2>
            <div>${colReady.map(buildCard).join('')}</div>
          </div>
          <div class="bg-stone-100/60 rounded-2xl p-4 border border-stone-200 shadow-inner min-h-[50vh] opacity-75">
            <h2 class="font-bold text-stone-800 mb-4 text-xs uppercase">Ολοκληρωμένες Σήμερα (${colCompleted.length})</h2>
            <div>${colCompleted.map(buildCard).join('')}</div>
          </div>
        </div>
      `;
    }

    window.updateOrder = async function(id, newStatus) {
      if (newStatus === 'CANCELLED' && !confirm('Σίγουρα θέλετε να ακυρώσετε αυτή την παραγγελία;')) return;
      ordersData = ordersData.map(o => o.id === id ? { ...o, prep_status: newStatus } : o);
      renderOrdersTab();
      await db.from("orders").update({ prep_status: newStatus }).eq("id", id);
    }

     // Η νέα συνάρτηση που Πληρώνει ΚΑΙ Παραδίδει ταυτόχρονα
    window.completeAndPayOrder = async function(id, isPaid) {
      if (!isPaid) {
        const confirmPay = confirm("Επιβεβαίωση Εξόφλησης στο ταμείο & Ολοκλήρωσης της παραγγελίας;");
        if (!confirmPay) return;
        
        // 1. Ενημέρωση τοπικά
        ordersData = ordersData.map(o => o.id === id ? { ...o, prep_status: 'COMPLETED', payment_status: 'PAID' } : o);
        renderOrdersTab();
        
        // 2. Ενημέρωση στη Βάση (Δύο πεδία μαζί)
        await db.from("orders").update({ prep_status: 'COMPLETED', payment_status: 'PAID' }).eq("id", id);
      } else {
        // Αν είναι ήδη πληρωμένη, απλά την ολοκληρώνουμε
        ordersData = ordersData.map(o => o.id === id ? { ...o, prep_status: 'COMPLETED' } : o);
        renderOrdersTab();
        await db.from("orders").update({ prep_status: 'COMPLETED' }).eq("id", id);
      }
    }


    // === TAB: ΚΡΑΤΗΣΕΙΣ ===
    function renderReservationsTab() {
      const content = document.getElementById('dashboardContent');
      const statsContainer = document.getElementById('statsContainer');

      const pendingCount = reservationsData.filter(r => r.status === "PENDING").length;
      if (statsContainer) {
        statsContainer.innerHTML = `
          <span class="text-2xl">📅</span>
          <div>
            <p class="text-xs text-stone-500 uppercase font-bold tracking-wider">Νεες Κρατησεις</p>
            <p class="text-xl font-bold text-amber-600">${pendingCount} Σε αναμονή</p>
          </div>
        `;
      }

      if (reservationsData.length === 0) {
        content.innerHTML = `<div class="bg-white border border-stone-200 rounded-2xl p-10 text-center shadow-sm"><p class="text-stone-500 font-medium text-lg">Δεν υπάρχουν κρατήσεις ακόμα.</p></div>`;
        return;
      }

      let html = `<div class="bg-white border border-stone-200 rounded-2xl shadow-sm overflow-hidden"><div class="divide-y divide-stone-100">`;
      
      reservationsData.forEach(res => {
        let statusBadge = '';
        let rowClass = 'hover:bg-stone-50';
        
        if (res.status === "PENDING") { statusBadge = '<span class="px-2 py-1 rounded text-xs font-bold bg-amber-100 text-amber-700">Αναμονή ⏳</span>'; rowClass = 'bg-amber-50/30 hover:bg-amber-50/50'; }
        if (res.status === "CONFIRMED") statusBadge = '<span class="px-2 py-1 rounded text-xs font-bold bg-emerald-100 text-emerald-700">Επιβεβαιώθηκε ✅</span>';
        if (res.status === "CANCELLED") statusBadge = '<span class="px-2 py-1 rounded text-xs font-bold bg-red-100 text-red-700">Ακυρώθηκε ❌</span>';

        html += `
          <div class="p-6 flex flex-col md:flex-row justify-between gap-4 transition-colors ${rowClass}">
            <div>
              <div class="flex items-center gap-3 mb-2">
                <h3 class="font-bold text-xl text-stone-900">${res.name}</h3>
                ${statusBadge}
              </div>
              <div class="text-stone-600 text-sm space-y-1">
                <p>📧 <strong>Email:</strong> ${res.email || '-'}</p>
                <p>📅 <strong>Ημ/νια:</strong> ${res.date} &nbsp;|&nbsp; ⏰ <strong>Ώρα:</strong> ${res.time}</p>
                <p>👥 <strong>Άτομα:</strong> ${res.guests}</p>
              </div>
            </div>
            <div class="flex flex-wrap items-start gap-2 border-l border-stone-200 pl-4">
              <button onclick="updateReservation(${res.id}, 'CONFIRMED')" class="bg-emerald-600 text-white px-4 py-2 text-sm rounded-md shadow-sm hover:bg-emerald-700 transition-colors">Επιβεβαίωση</button>
              <button onclick="updateReservation(${res.id}, 'CANCELLED')" class="bg-stone-600 text-white px-4 py-2 text-sm rounded-md shadow-sm hover:bg-stone-700 transition-colors">Ακύρωση</button>
              <button onclick="updateReservation(${res.id}, 'PENDING')" class="bg-white border border-stone-300 text-stone-700 px-4 py-2 text-sm rounded-md hover:bg-stone-100 transition-colors">Αναμονή</button>
              
              <div class="w-full h-[1px] bg-stone-200 my-1 hidden md:block"></div> <button onclick="deleteReservation(${res.id})" class="bg-red-500 text-white px-4 py-2 text-sm rounded-md shadow-sm hover:bg-red-700 transition-colors w-full flex items-center justify-center gap-1">
                🗑️ Διαγραφή
              </button>
            </div>
          </div>`;
      });
      html += `</div></div>`;
      content.innerHTML = html;
    }

    window.updateReservation = async function(id, newStatus) {
      const reservation = reservationsData.find(r => r.id === id);
      
      const { data: restaurant } = await db
        .from("restaurants")
        .select("email_template_id")
        .eq("id", reservation.restaurant_id)
        .single();

      let statusMsg = "";
      let statusColor = "";
      
      if (newStatus === "CONFIRMED") {
        statusMsg = "Τα καλά νέα μόλις έφτασαν! Η κράτησή σου στη Μαργαρίτα ΕΠΙΒΕΒΑΙΩΘΗΚΕ. Σε περιμένουμε!";
        statusColor = "#10b981"; 
      } else if (newStatus === "CANCELLED") {
        statusMsg = "Λυπούμαστε, αλλά η κράτησή σου ΑΚΥΡΩΘΗΚΕ. Αν πιστεύεις πως έχει γίνει λάθος ή επιθυμείς άλλη ώρα, επικοινώνησε μαζί μας.";
        statusColor = "#ef4444"; 
      } else if (newStatus === "PENDING") {
        statusMsg = "Η κράτησή σου τέθηκε ξανά σε ΑΝΑΜΟΝΗ. Θα εξετάσουμε τη διαθεσιμότητά μας και θα σε ειδοποιήσουμε άμεσα.";
        statusColor = "#f59e0b"; 
      }

      if (reservation.email && reservation.email.trim() !== "") {
        try {
          // Η ΝΕΑ ΜΑΣ ΑΣΦΑΛΗΣ ΚΛΗΣΗ ΣΤΟ BACKEND
          const response = await fetch('https://yolfsfforkibqvagahoq.supabase.co/functions/v1/send-email', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({
              template_id: restaurant.email_template_id,
              template_params: {
                name: reservation.name,
                email: reservation.email,
                date: reservation.date,
                time: reservation.time,
                guests: reservation.guests,
                status_message: statusMsg,
                color: statusColor
              }
            })
          });

          if (response.ok) {
            alert("Το email ενημέρωσης στάλθηκε στον πελάτη!");
          } else {
            const errData = await response.json();
            console.error("Σφάλμα από Edge Function:", errData);
            alert("Σφάλμα αποστολής Email. Δες την κονσόλα!");
          }
        } catch (error) {
          console.error("Σφάλμα δικτύου:", error);
        }
      }
      
      reservationsData = reservationsData.map(r => r.id === id ? { ...r, status: newStatus } : r);
      renderReservationsTab();
      await db.from("reservations").update({ status: newStatus }).eq("id", id);
    }

    window.deleteReservation = async function(id) {
      if (confirm("Είστε σίγουρος ότι θέλετε να διαγράψετε οριστικά αυτή την κράτηση;")) {
        reservationsData = reservationsData.filter(r => r.id !== id);
        renderReservationsTab();
        await db.from("reservations").delete().eq("id", id);
      }
    }

    // === TAB: ΠΡΟΙΟΝΤΑ ===
    function renderProducts() {
      const content = document.getElementById('dashboardContent');
      const statsContainer = document.getElementById('statsContainer');

      const availableCount = productsData.filter(p => p.status === "AVAILABLE").length;
      if (statsContainer) {
        statsContainer.innerHTML = `
          <span class="text-2xl">🍽️</span>
          <div>
            <p class="text-xs text-stone-500 uppercase font-bold tracking-wider">Ενεργα</p>
            <p class="text-xl font-bold text-stone-800">${availableCount} / ${productsData.length}</p>
          </div>
        `;
      }

      const normalizedSearchTerm = normalizeText(searchTerm).trim();
      const filteredProducts = productsData.filter(product => {
        if (!normalizedSearchTerm) return true;
        const normName = normalizeText(product.name);
        const normCat = normalizeText(product.category);

        if (normName.includes(normalizedSearchTerm) || normCat.includes(normalizedSearchTerm)) return true;

        if (normCat) {
          for (const [catKey, keywords] of Object.entries(categorySynonyms)) {
            if (normCat.includes(catKey)) {
              const matchFound = keywords.some(kw => kw.includes(normalizedSearchTerm) || normalizedSearchTerm.includes(kw));
              if (matchFound) return true;
            }
          }
        }
        return false;
      });
    
      const customCategoryOrder = ['Ορεκτικά', 'Σαλάτες', 'Ζυμαρικά', 'Gnocchi', 'Πίτσες', 'Αναψυκτικά'];

      filteredProducts.sort((a, b) => {
        let catA = customCategoryOrder.indexOf(a.category);
        let catB = customCategoryOrder.indexOf(b.category);
        if (catA === -1) catA = 99;
        if (catB === -1) catB = 99;
        if (catA !== catB) return catA - catB;
        if (a.sort_order !== b.sort_order) return (a.sort_order || 999) - (b.sort_order || 999);
        return a.id - b.id;
      });

      if (filteredProducts.length === 0) {
        content.innerHTML = `<div class="bg-white border border-stone-200 rounded-2xl p-10 text-center shadow-sm"><p class="text-stone-500 font-medium text-lg">Δεν βρέθηκαν προϊόντα.</p></div>`;
        return;
      }

      let html = `<div class="bg-white border border-stone-200 rounded-2xl shadow-sm overflow-hidden"><div class="divide-y divide-stone-100">`;

      filteredProducts.forEach(product => {
        let missingToday = [];
        let missingPerm = [];
        let productIngs = [];
        
        if (typeof product.ingredients === 'string') {
          try { productIngs = JSON.parse(product.ingredients); } catch(e) {}
        } else if (Array.isArray(product.ingredients)) {
          productIngs = product.ingredients;
        }

        if (productIngs.length > 0) {
          productIngs.forEach(ingName => {
            const globalIng = ingredientsData.find(i => normalizeText(i.name).trim() === normalizeText(ingName).trim());
            if (globalIng) {
              if (globalIng.status === 'UNAVAILABLE_TODAY') missingToday.push(globalIng.name);
              else if (globalIng.status === 'UNAVAILABLE') missingPerm.push(globalIng.name);
            }
          });
        }

        let missingHtml = '';
        if (missingToday.length > 0) {
          missingHtml += `<div class="text-xs font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded mt-1.5 inline-block mr-2">⚠️ Προσωρινά χωρίς: ${missingToday.join(', ')}</div>`;
        }
        if (missingPerm.length > 0) {
          missingHtml += `<div class="text-xs font-semibold text-red-700 bg-red-50 border border-red-200 px-2 py-0.5 rounded mt-1.5 inline-block">⚠️ Μη διαθέσιμο: ${missingPerm.join(', ')}</div>`;
        }

        let statusBadge = '';
        if (product.status === "AVAILABLE") statusBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-emerald-100 text-emerald-700">Διαθέσιμο</span>';
        if (product.status === "UNAVAILABLE_TODAY") statusBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-amber-100 text-amber-700">Εξαντλήθηκε</span>';
        if (product.status === "UNAVAILABLE") statusBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-700">Μη Διαθέσιμο</span>';
        if (product.status === "HIDDEN") statusBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-stone-200 text-stone-600">Αόρατο</span>';

        let nameClass = product.status === "HIDDEN" ? "text-stone-400 line-through" : "text-stone-900";
        let btnActive = product.status === "AVAILABLE" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500 hover:text-stone-700";
        let btnToday = product.status === "UNAVAILABLE_TODAY" ? "bg-white text-amber-600 shadow-sm" : "text-stone-500 hover:text-stone-700";
        let btnClosed = product.status === "UNAVAILABLE" ? "bg-white text-red-600 shadow-sm" : "text-stone-500 hover:text-stone-700";
        let btnHidden = product.status === "HIDDEN" ? "bg-white text-stone-800 shadow-sm" : "text-stone-500 hover:text-stone-700";

        html += `
          <div class="p-5 flex flex-col xl:flex-row xl:items-center justify-between gap-4 hover:bg-stone-50 transition-colors">
            <div>
              <div class="flex items-center gap-3">
                <h3 class="text-base font-bold font-serif text-lg ${nameClass}">${product.name}</h3>
                ${statusBadge}
              </div>
              <div class="text-sm text-stone-500 mt-1">${product.category || 'Χωρίς Κατηγορία'}</div>
              ${missingHtml}
            </div>
            <div class="flex bg-stone-100 p-1 rounded-lg border border-stone-200 self-start flex-wrap">
              <button onclick="changeStatus(${product.id}, 'AVAILABLE')" class="px-4 py-2 text-sm font-semibold rounded-md transition-all ${btnActive}">Ενεργό ✅</button>
              <button onclick="changeStatus(${product.id}, 'UNAVAILABLE_TODAY')" class="px-4 py-2 text-sm font-semibold rounded-md transition-all ${btnToday}">Για Σήμερα ✖</button>
              <button onclick="changeStatus(${product.id}, 'UNAVAILABLE')" class="px-4 py-2 text-sm font-semibold rounded-md transition-all ${btnClosed}">Οριστικά ❌</button>
              <button onclick="changeStatus(${product.id}, 'HIDDEN')" class="px-4 py-2 text-sm font-semibold rounded-md transition-all ${btnHidden}">Απόκρυψη 👁️</button>
            </div>
          </div>`;
      });

      html += `</div></div>`;
      content.innerHTML = html;
    }

    window.changeStatus = async function(id, newStatus) {
      productsData = productsData.map(p => p.id === id ? { ...p, status: newStatus } : p);
      renderProducts();
      await db.from("menu_items").update({ status: newStatus }).eq("id", id);
    }

    // === TAB: ΑΠΟΘΗΚΗ ===
    function renderIngredientsTab() {
      const content = document.getElementById('dashboardContent');
      const statsContainer = document.getElementById('statsContainer');

      const missingCount = ingredientsData.filter(i => i.status !== "AVAILABLE").length;
      if (statsContainer) {
        statsContainer.innerHTML = `
          <span class="text-2xl">📦</span>
          <div>
            <p class="text-xs text-stone-500 uppercase font-bold tracking-wider">Σε Ελλειψη</p>
            <p class="text-xl font-bold text-stone-800">${missingCount} Υλικά</p>
          </div>
        `;
      }

      const normalizedSearchTerm = normalizeText(searchTerm).trim();
      const filteredIngredients = ingredientsData.filter(ing => {
        return normalizeText(ing.name).includes(normalizedSearchTerm);
      });

      let html = `<div class="bg-white border border-stone-200 rounded-2xl shadow-sm overflow-hidden mt-2"><div class="divide-y divide-stone-100">`;

      if (filteredIngredients.length === 0) {
        html += `<div class="p-8 text-center text-stone-500">Δεν βρέθηκαν υλικά.</div>`;
      }

      filteredIngredients.forEach(ing => {
        let statusBadge = '';
        if (ing.status === "AVAILABLE") statusBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-emerald-100 text-emerald-700">Διαθέσιμο</span>';
        if (ing.status === "UNAVAILABLE_TODAY") statusBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-amber-100 text-amber-700">Μόνο για Σήμερα ✖</span>';
        if (ing.status === "UNAVAILABLE") statusBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-700">Οριστικά Εκτός</span>';

        let nameClass = ing.status !== "AVAILABLE" ? "text-stone-400 line-through" : "text-stone-900";
        let btnActive = ing.status === "AVAILABLE" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500 hover:text-stone-700";
        let btnToday = ing.status === "UNAVAILABLE_TODAY" ? "bg-white text-amber-600 shadow-sm" : "text-stone-500 hover:text-stone-700";
        let btnClosed = ing.status === "UNAVAILABLE" ? "bg-white text-red-600 shadow-sm" : "text-stone-500 hover:text-stone-700";

        html += `
          <div class="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-stone-50 transition-colors">
            <div class="flex items-center gap-3">
              <h3 class="text-base font-bold text-lg ${nameClass}">${ing.name}</h3>
              ${statusBadge}
            </div>
            <div class="flex bg-stone-100 p-1 rounded-lg border border-stone-200 self-start">
              <button onclick="changeIngredientStatus(${ing.id}, 'AVAILABLE')" class="px-4 py-2 text-sm font-semibold rounded-md transition-all ${btnActive}">Διαθέσιμο ✅</button>
              <button onclick="changeIngredientStatus(${ing.id}, 'UNAVAILABLE_TODAY')" class="px-4 py-2 text-sm font-semibold rounded-md transition-all ${btnToday}">Για Σήμερα ✖</button>
              <button onclick="changeIngredientStatus(${ing.id}, 'UNAVAILABLE')" class="px-4 py-2 text-sm font-semibold rounded-md transition-all ${btnClosed}">Οριστικά ❌</button>
            </div>
          </div>`;
      });
      html += `</div></div>`;
      content.innerHTML = html;
    }

    window.changeIngredientStatus = async function(id, newStatus) {
      ingredientsData = ingredientsData.map(i => i.id === id ? { ...i, status: newStatus } : i);
      renderIngredientsTab();
      if (activeTab === 'products') renderProducts();
      await db.from("ingredients").update({ status: newStatus }).eq("id", id);
    }

    init();
  </script>
